[package]
name = "natto64-opentelemetry-example"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "natto64-opentelemetry-example"
path = "main.rs"

[dependencies]
natto64 = { path = "../../natto64" }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["metrics"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
